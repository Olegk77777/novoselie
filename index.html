<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Заголовок вкладки подставляется из locales/ru.json при запуске игры -->
  <title>...</title>

  <!-- Дизайн-токены (гибрид «Уют»: стекло-HUD + бумага ЖЭКа). См. design/STYLE.md -->
  <link rel="stylesheet" href="design/colors.css?v=84">
  <link rel="stylesheet" href="design/type.css?v=84">

  <style>
    /* Убираем отступы браузера, чтобы 3D-сцена занимала весь экран */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: var(--bg-dusk);
    }
    canvas { display: block; }

    /* ============================================================
       Гибрид «Уют»: тёмное «стекло» (B) для мира/HUD + тёплая
       «бумага ЖЭКа» (A) для всего, что обращается к игроку.
       Раскладка элементов сохранена — поменялись только материи.
       ============================================================ */

    /* --- Стеклянная пластина (база для HUD-элементов B) --- */
    /* используется в шкале уюта, кнопках, «Свернуть», модале */

    /* Кнопки действий (поворот/убрать) — в правом верхнем углу, НИЖЕ кнопки
       «Любование» (та сидит в самом углу), чтобы не накладывались. */
    #ui-top {
      position: fixed;
      top: 66px;
      right: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 5;
    }

    /* === Кнопка «Любование» — скрывает весь интерфейс ради комнаты === */
    /* Стоит в правом верхнем углу: тонкая стеклянная плитка с амбер-глазом.
       Отдельный fixed-элемент — остаётся видимой, когда HUD скрыт (можно вернуть). */
    #ui-cinema {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 6;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: linear-gradient(160deg, var(--panel-glass), var(--panel-glass-2));
      border: 1px solid var(--panel-stroke);
      border-radius: var(--r-btn);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4);
      color: var(--amber);
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.45s ease, color 0.3s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    #ui-cinema svg { width: 24px; height: 24px; display: block; }
    #ui-cinema:hover {
      opacity: 1;
      border-color: var(--amber);
      box-shadow: 0 0 14px rgba(232, 185, 106, 0.3);
    }
    /* Глаз «горит» кремовым, когда мы в режиме любования */
    #ui-cinema.watching { color: var(--text-cream); }

    /* === Кнопка «Звук» — выключить/включить фоновую музыку === */
    /* Та же стеклянная плитка, что и «глаз», стоит слева от него (right: 66px). */
    #ui-sound {
      position: fixed;
      top: 14px;
      right: 66px;
      z-index: 6;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: linear-gradient(160deg, var(--panel-glass), var(--panel-glass-2));
      border: 1px solid var(--panel-stroke);
      border-radius: var(--r-btn);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4);
      color: var(--amber);
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.45s ease, color 0.3s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    #ui-sound svg { width: 24px; height: 24px; display: block; }
    #ui-sound:hover {
      opacity: 1;
      border-color: var(--amber);
      box-shadow: 0 0 14px rgba(232, 185, 106, 0.3);
    }
    /* Звук выключен — иконка гаснет до приглушённого серого */
    #ui-sound.muted { color: var(--text-muted); }

    /* Плавное появление/исчезновение элементов HUD */
    #ui-left, #ui-top, #ui-bottom, #ui-hint-toast, #ui-sound {
      transition: opacity 0.5s ease;
    }
    /* Режим любования: прячем весь HUD, оставляем лишь приглушённый глаз.
       #ui-top НЕ прячем: в нём кнопки «Повернуть/Убрать», которые сами видны ТОЛЬКО когда
       предмет в руке. Значит при расстановке в режиме любования управление есть (важно для
       iPad, где нет клавиш R/Esc), а в покое (запись) кадр остаётся чистым. */
    body.cinema #ui-left,
    body.cinema #ui-bottom,
    body.cinema #ui-hint-toast,
    body.cinema #ui-sound {
      opacity: 0;
      pointer-events: none;
    }
    body.cinema #ui-cinema { opacity: 0.32; }
    body.cinema #ui-cinema:hover { opacity: 1; }
    /* Низ — панель предметов по центру; «Свернуть» прижата влево. */
    /* z-index ВЫШЕ, чем у левого журнала (#ui-left): на планшете бумажки квестов
       и бонусов свисают в нижний угол — функциональная панель, «Свернуть» и ячейки
       должны лежать ПОВЕРХ них и оставаться кликабельными. */
    #ui-bottom {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      max-width: 96vw;
      z-index: 5;
    }
    #ui-panel-wrap {
      position: relative;
      max-width: 100%;
    }

    /* === Панель предметов — прозрачное стекло с размытием === */
    #ui-panel {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      max-width: 100%;
      overflow-x: auto;
      background: linear-gradient(180deg, var(--panel-trans), var(--panel-trans-2));
      border: 1px solid var(--panel-stroke);
      border-top-color: rgba(232, 185, 106, 0.16);
      border-radius: var(--r-plate);
      box-shadow: 0 -8px 26px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      color: var(--text-cream);
      user-select: none;
      scrollbar-width: auto;
      scrollbar-color: var(--amber) rgba(0, 0, 0, 0.3);
    }
    #ui-panel.collapsed { display: none; }
    #ui-panel::-webkit-scrollbar { height: 11px; }
    #ui-panel::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
    }
    #ui-panel::-webkit-scrollbar-thumb {
      background: linear-gradient(var(--amber), var(--amber-deep));
      border-radius: 6px;
      border: 1px solid var(--amber-deep);
    }

    /* Стрелки-индикаторы прокрутки — амбер на тёмном */
    .ui-scroll-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      line-height: 1;
      color: var(--amber);
      background: rgba(232, 185, 106, 0.1);
      border: 1px solid var(--panel-stroke);
      border-radius: 9px;
      cursor: pointer;
      z-index: 3;
    }
    .ui-scroll-left { left: 6px; }
    .ui-scroll-right { right: 6px; }
    .ui-scroll-arrow[hidden] { display: none; }

    /* Кнопка свернуть/развернуть — стекло, амбер-текст */
    #ui-toggle {
      margin-left: 12px;
      padding: 9px 20px;
      background: linear-gradient(160deg, var(--panel-glass), var(--panel-glass-2));
      border: 1px solid var(--panel-stroke);
      border-radius: var(--r-btn);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4);
      color: var(--amber);
      font-family: var(--font-ui);
      font-size: var(--fs-ui);
      font-weight: 600;
      cursor: pointer;
    }

    /* === Ячейка предмета === */
    .ui-slot-wrap {
      flex: 0 0 auto;
      width: 88px;
    }
    .ui-slot {
      position: relative;
      width: 76px;
      height: 84px;
      margin: 0 auto;
      display: block;
      background: linear-gradient(160deg, rgba(29, 29, 46, 0.7), rgba(18, 18, 30, 0.7));
      border: 1px solid #3a3550;
      border-radius: var(--r-cell);
      cursor: pointer;
      color: inherit;
      padding: 4px;
    }
    .ui-slot:hover {
      border-color: var(--panel-stroke-2);
    }
    .ui-slot.empty {
      opacity: 0.4;
      border-style: dashed;
      background: rgba(15, 15, 24, 0.4);
      cursor: default;
    }
    /* отключена (0 шт, но включена логикой) — поблёкла */
    .ui-slot.disabled {
      opacity: 0.45;
      filter: grayscale(0.6);
    }
    /* заблокирована до ремонта — пунктир + замок, иконку прячем */
    .ui-slot.locked {
      border-style: dashed;
      border-color: #3a3550;
      background: rgba(15, 15, 24, 0.5);
      opacity: 1;
      filter: none;
    }
    .ui-slot.locked .ui-slot-img { visibility: hidden; }
    .ui-slot.locked::after {
      content: '🔒';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: var(--locked);
    }
    .ui-slot-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    /* Бейдж количества — амбер-плашка с тёмными цифрами */
    .ui-slot-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-num);
      font-size: 12px;
      font-weight: 800;
      color: #2a1c0e;
      background: linear-gradient(var(--amber), var(--amber-deep));
      border-radius: 6px;
      box-shadow: 0 0 8px var(--glow-amber);
      pointer-events: none;
    }
    .ui-slot-label {
      font-family: var(--font-paper);
      font-size: var(--fs-cell);
      color: var(--text-cream-dim);
      text-align: center;
      margin-top: 5px;
      overflow-wrap: break-word;
    }

    /* === Кнопки действий (стекло) === */
    #ui-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    #ui-actions[hidden] { display: none; }
    .ui-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      background: linear-gradient(160deg, var(--panel-glass), var(--panel-glass-2));
      border: 1px solid var(--panel-stroke-2);
      border-radius: var(--r-btn);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
      color: var(--text-cream);
      font-family: var(--font-ui);
      font-size: var(--fs-ui);
      font-weight: 600;
      cursor: pointer;
    }
    .ui-btn:hover {
      border-color: var(--amber);
      background: linear-gradient(160deg, rgba(40, 38, 58, 0.95), rgba(24, 24, 38, 0.97));
      box-shadow: 0 0 16px rgba(232, 185, 106, 0.25), 0 6px 14px rgba(0, 0, 0, 0.45);
      color: #fff4dd;
    }
    .ui-btn:active {
      background: linear-gradient(160deg, rgba(16, 16, 26, 0.97), rgba(10, 10, 18, 0.98));
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
      color: var(--amber);
      transform: translateY(1px);
    }
    .ui-btn-ico { color: var(--amber); font-size: 1.2em; line-height: 1; }

    /* === Левая колонка: шкала уюта + журнал + бонусы === */
    /* СЛОЙ НИЖЕ функциональной панели (#ui-bottom z-index:5) — журнал чисто
       информационный, поэтому pointer-events:none (клики проходят насквозь) и
       z-index:1: если бумажки свисают на «Свернуть»/ячейки, те остаются сверху и
       рабочими. */
    #ui-left {
      position: fixed;
      top: 14px;
      left: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1;
      pointer-events: none;
      max-width: 250px;
    }

    /* Шкала уюта — стеклянная пластина */
    #ui-comfort {
      padding: 12px 16px 14px;
      background: linear-gradient(160deg, rgba(28, 28, 43, 0.92), rgba(16, 16, 26, 0.95));
      border: 1px solid var(--panel-stroke);
      border-radius: var(--r-plate);
      box-shadow: 0 0 0 1px rgba(232, 185, 106, 0.1),
                  0 10px 24px rgba(0, 0, 0, 0.5),
                  inset 0 0 32px rgba(201, 127, 61, 0.1);
      user-select: none;
    }
    .ui-comfort-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }
    .ui-comfort-label {
      font-family: var(--font-stamp);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-weight: 600;
      font-size: 15px;
      color: var(--amber);
    }
    .ui-comfort-value {
      font-family: var(--font-num);
      font-weight: 700;
      font-size: var(--fs-meter);
      color: var(--text-cream);
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .ui-comfort-total { color: var(--text-muted); }
    .ui-comfort-bar {
      height: 15px;
      margin-top: 9px;
      padding: 3px;
      background: var(--well);
      border-radius: 6px;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    .ui-comfort-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      background: var(--accent-grad);
      box-shadow: 0 0 12px var(--glow-amber);
      transition: width 0.4s ease;
    }

    /* Журнал заданий — бумажный слип ЖЭКа со скрепкой */
    #ui-quests {
      position: relative;
      padding: 14px 16px 15px;
      background: linear-gradient(165deg, var(--paper), var(--paper-2));
      border: 1px solid var(--paper-edge);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      color: var(--ink);
      transform: rotate(-1.2deg);
      user-select: none;
    }
    /* скрепка сверху */
    #ui-quests::before {
      content: '';
      position: absolute;
      top: -13px;
      left: 18%;
      width: 24px;
      height: 32px;
      border: 4px solid #9aa0a6;
      border-bottom: none;
      border-radius: 11px 11px 0 0;
      transform: rotate(8deg);
    }
    .ui-quests-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      border-bottom: 1px dashed var(--paper-line);
      padding-bottom: 8px;
      margin-bottom: 9px;
    }
    .ui-quests-label {
      font-family: var(--font-stamp);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      font-size: 17px;
      color: var(--stamp);
    }
    .ui-quests-count {
      font-family: var(--font-paper);
      font-size: 15px;
      color: var(--ink-soft);
    }
    .ui-quest-line {
      display: flex;
      gap: 8px;
      font-family: var(--font-paper);
      font-size: calc(var(--fs-paper) * 1.15);
      line-height: 1.5;
      margin-top: 6px;
      color: var(--ink);
    }
    .ui-quest-check { color: var(--stamp); font-weight: 700; }

    /* Бонус-чипы — бумажные полоски с тёплым кантом */
    .ui-combos {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ui-combo-line {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: linear-gradient(#f3ecd9, #e7dabb);
      border: 1px solid var(--paper-edge);
      border-left: 5px solid var(--amber-deep);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4);
      color: var(--ink);
    }
    .ui-combo-line:nth-child(odd) { transform: rotate(-0.6deg); }
    .ui-combo-line:nth-child(even) { transform: rotate(0.5deg); }
    .ui-combo-amount {
      font-family: var(--font-num);
      font-weight: 800;
      font-size: 15px;
      color: #b06a26;
    }
    .ui-combo-name { font-family: var(--font-paper); font-size: 13px; }

    /* === Подсказка-тост — бумажный слип со «скотчем» === */
    #ui-hint-toast {
      position: fixed;
      top: 14px;
      /* центрируем над КОМНАТОЙ: она сдвинута вправо на --room-offset (см. game.js) */
      left: calc(50% + var(--room-offset, 0px));
      transform: translateX(-50%) rotate(-0.5deg);
      padding: 11px 24px;
      background: linear-gradient(#f4edd9, #e7dabb);
      border: 1px solid var(--paper-edge);
      border-radius: 2px;
      box-shadow: 0 9px 20px rgba(0, 0, 0, 0.5);
      color: var(--ink);
      font-family: var(--font-paper);
      font-size: var(--fs-paper);
      text-align: center;
      max-width: 90vw;
      pointer-events: none;
    }
    /* «скотч» сверху */
    #ui-hint-toast::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 58px;
      height: 14px;
      background: var(--tape);
      border: 1px solid rgba(138, 47, 40, 0.25);
    }
    #ui-hint-toast.flash { animation: hint-flash 0.5s ease; }
    @media (max-width: 900px) {
      #ui-hint-toast { top: 92px; }
    }
    @keyframes hint-flash {
      0% { transform: translateX(-50%) rotate(-0.5deg) scale(1.12); }
      100% { transform: translateX(-50%) rotate(-0.5deg) scale(1); }
    }

    /* === Модальное окно — стекло + сканлайны + бумажный кикер === */
    #ui-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(12, 10, 22, 0.74);
    }
    #ui-modal[hidden] { display: none; }
    .ui-modal-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(160deg, #1c1c2b, #14141f);
      border: 1px solid var(--panel-stroke);
      border-radius: var(--r-modal);
      padding: 28px 34px 26px;
      max-width: 560px;
      text-align: center;
      box-shadow: 0 0 0 1px rgba(232, 185, 106, 0.12),
                  var(--shadow-deep),
                  inset 0 0 60px rgba(201, 127, 61, 0.1);
    }
    /* тонкие линии развёртки (CRT-нюанс) */
    .ui-modal-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 3px);
      pointer-events: none;
    }
    /* зелёный вариант — «задание выполнено» */
    .ui-modal-card.done {
      background: linear-gradient(160deg, #1c2b1f, #14180f);
      border-color: #4a6048;
      box-shadow: 0 0 0 1px rgba(111, 143, 78, 0.18),
                  var(--shadow-deep),
                  inset 0 0 60px rgba(111, 143, 78, 0.1);
    }
    /* кикер — бумажный штамп */
    .ui-modal-kicker {
      position: relative;
      display: inline-block;
      transform: rotate(-1.5deg);
      background: linear-gradient(#f4edd9, #e7dabb);
      border: 1px solid var(--paper-edge);
      padding: 4px 14px;
      font-family: var(--font-stamp);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-weight: 700;
      font-size: 12px;
      color: var(--stamp);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      margin-bottom: 14px;
    }
    .ui-modal-card.done .ui-modal-kicker {
      background: linear-gradient(#eef0d9, #dde2bb);
      border-color: #b4bd8a;
      color: #46612e;
    }
    .ui-modal-text {
      position: relative;
      color: var(--text-cream-dim);
      font-family: var(--font-paper);
      font-size: clamp(15px, 1.8vw, 19px);
      line-height: 1.6;
      margin-bottom: 22px;
      white-space: pre-line; /* переносы в приветствии — строфами */
    }
    .ui-modal-ok {
      position: relative;
      padding: 12px 26px;
      background: linear-gradient(var(--amber), var(--amber-deep));
      border: none;
      border-radius: var(--r-btn);
      color: #2a1c0e;
      font-family: var(--font-ui);
      font-size: var(--fs-ui);
      font-weight: 700;
      box-shadow: 0 0 18px rgba(232, 185, 106, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      cursor: pointer;
    }
    .ui-modal-card.done .ui-modal-ok {
      background: linear-gradient(#a7c47e, #6f8f4e);
      color: #1c2410;
      box-shadow: 0 0 18px rgba(111, 143, 78, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    /* Ряд кнопок для модала-выбора (напр. «Со звуком / Без звука») */
    .ui-modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    /* Вторая кнопка выбора — приглушённое стекло, чтобы основная (амбер) доминировала */
    .ui-modal-alt {
      background: linear-gradient(160deg, var(--panel-glass), var(--panel-glass-2));
      color: var(--text-cream);
      border: 1px solid var(--panel-stroke);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4);
    }
    .ui-modal-alt:hover {
      border-color: var(--amber);
      color: #fff4dd;
    }
    .ui-modal-card.pop { animation: modal-pop 0.32s ease; }
    @keyframes modal-pop {
      0% { transform: scale(0.82); opacity: 0; }
      60% { transform: scale(1.04); }
      100% { transform: scale(1); opacity: 1; }
    }
    @media (max-width: 900px) {
      .ui-modal-card { padding: 24px 24px; max-width: 88vw; }
    }

    /* ============================================================
       РЕЖИМ ЛЮБОВАНИЯ — кино-слои поверх холста (см. src/cinema.js).
       Сами div'ы создаёт cinema.js; здесь только их вид и появление по body.cinema.
       Все pointer-events:none (касания идут к document → выход из режима).
       z-index: выше canvas (0), ниже «глаза» (#ui-cinema z6) и модалок (z20).
       Грейд/виньетка/зерно — прямые дети body: mix-blend-mode смешивает их с холстом
       (общая обёртка с opacity их бы изолировала).
       ============================================================ */

    /* Чёрные кино-полосы (letterbox 2.40:1). Вне cinema высота 0; въезжают мягко.
       max(0,…) — на портретном окне высота не уходит в минус. */
    #cine-bar-top, #cine-bar-bottom {
      position: fixed;
      left: 0;
      right: 0;
      height: 0;
      background: #070708;
      z-index: 4;
      pointer-events: none;
      transition: height 1.2s cubic-bezier(.2, .7, .1, 1);
    }
    #cine-bar-top { top: 0; }
    #cine-bar-bottom { bottom: 0; }
    /* Кино-рамка. Высота полос = «остаток» после вписывания кадра 2.0:1, НО ограничена
       сверху 7vh: иначе на квадратном экране (iPad 4:3) до 2:1 пришлось бы срезать ~17% высоты
       (огромные полосы), тогда как на широком ПК (16:9) полосы и так крошечные (~5.5vh).
       clamp держит их одинаково тонкими везде. На портрете остаток < 0 → clamp даёт 0 (без полос). */
    body.cinema #cine-bar-top,
    body.cinema #cine-bar-bottom { height: clamp(0px, calc((100vh - 100vw / 2.0) / 2), 7vh); }

    /* Общая база плёночных слоёв */
    #cine-grade, #cine-vignette, #cine-grain {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    /* Сумеречный грейд: холодный верх / тёплый низ. soft-light (overlay выжег бы окно). */
    #cine-grade {
      background: linear-gradient(to bottom, rgb(40, 52, 80) 0%, rgb(120, 86, 48) 100%);
      mix-blend-mode: soft-light;
    }
    body.cinema #cine-grade { opacity: 0.22; }
    /* Тёплая виньетка — топит углы в холодную мглу, тянет глаз к центру/ламповому теплу. */
    #cine-vignette {
      background: radial-gradient(ellipse at center, transparent 48%, rgba(10, 12, 20, 0.62) 100%);
      mix-blend-mode: multiply;
    }
    body.cinema #cine-vignette { opacity: 1; }
    /* Плёночное зерно — PNG-тайл (iPad-safe), «кипит» дискретными шагами ~12 fps (step-end). */
    #cine-grain {
      background: url('textures/grain_overlay.png') repeat;
      background-size: 128px 128px;
      mix-blend-mode: overlay;
    }
    /* Зерно «кипит» только в режиме любования. Вне его слой невидим (opacity:0), но
       анимировать полноэкранный blend-слой весь сеанс — впустую грузить композитор браузера
       (правка перф-аудита). Картинка идентична: вне cinema зерно и так не видно. */
    body.cinema #cine-grain { opacity: 0.07; animation: cine-grain 0.72s step-end infinite; }
    /* На слабом железе зерно статично (без перерисовки полноэкранного блендового слоя). */
    body.cine-lowend #cine-grain { animation: none; }
    @keyframes cine-grain {
      0%   { background-position: 0 0; }
      12%  { background-position: -41px 23px; }
      25%  { background-position: 17px -53px; }
      37%  { background-position: -63px -11px; }
      50%  { background-position: 29px 47px; }
      62%  { background-position: -19px 61px; }
      75%  { background-position: 53px -29px; }
      87%  { background-position: -47px -41px; }
      100% { background-position: 0 0; }
    }

    /* ============================================================
       ПЛЁНОЧНОЕ ЗЕРНО — ПОСТОЯННЫЙ слой поверх всей игры (благородное крупное).
       Это CSS-оверлей, а НЕ проход 3D-движка: браузер смешивает готовый кадр с
       тайлом зерна на видеокарте почти бесплатно — ни одного лишнего прохода рендера
       (iPad-safe, не греет систему — тот же приём, что у кино-слоёв режима любования).
       Тайл бесшовный, монохромный (серебро, не цветной цифровой шум).
       z-index 2: ПОВЕРХ холста игры (0), но ПОД функциональным UI (5+), кино-полосами (4)
       и модалками (20). pointer-events:none — клики идут сквозь зерно к сцене. */
    #film-grain {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: url('textures/film_grain.png') repeat;
      background-size: 256px 256px;   /* крупность зерна на экране (крупнее тайла → крупнее зерно) */
      mix-blend-mode: overlay;        /* зерно осветляет/затемняет, не перекрашивает */
      opacity: 0.18;                  /* благородно: фактура видна на средних тонах и свету,
                                         в глубоких тенях деликатна (как настоящая плёнка).
                                         Хочешь сильнее/слабее — крути это одно число (0.10–0.26). */
      will-change: background-position;
    }
    /* Живое «кипение» зерна (как настоящая плёнка/проектор) — лёгкий сдвиг тайла ~10 fps.
       Сдвиги некратны тайлу (256) → повтор позиции не читается. */
    #film-grain { animation: film-grain 0.9s steps(1) infinite; }
    @keyframes film-grain {
      0%   { background-position: 0 0; }
      11%  { background-position: -37px 19px; }
      22%  { background-position: 23px -47px; }
      33%  { background-position: -61px -13px; }
      44%  { background-position: 31px 43px; }
      55%  { background-position: -17px 59px; }
      66%  { background-position: 49px -31px; }
      77%  { background-position: -43px -53px; }
      88%  { background-position: 13px -23px; }
      100% { background-position: 0 0; }
    }
    /* Слабое железо (ретина+сенсор ≈ iPad): ОБЛЕГЧЁННОЕ «кипение».
       На Маке зерно «кипит» сдвигом background-position — на iOS Safari это рискованно
       (перерисовка полноэкранного blend-слоя через CPU = нагрев). Здесь двигаем слой
       через transform: translate3d — composite-only операция (GPU переставляет уже
       готовую текстуру, БЕЗ перерисовки), плюс кадры вдвое реже (~6 fps). Слой растянут
       с запасом (inset -24px), чтобы сдвиг не оголил края экрана.
       Класс body.cine-lowend ставит cinema.js при старте (есть всегда). */
    body.cine-lowend #film-grain {
      inset: -24px;
      will-change: transform;
      animation: film-grain-lite 1.4s steps(1) infinite;
    }
    @keyframes film-grain-lite {
      0%   { transform: translate3d(0, 0, 0); }
      12%  { transform: translate3d(-13px, 7px, 0); }
      25%  { transform: translate3d(9px, -15px, 0); }
      37%  { transform: translate3d(-17px, -5px, 0); }
      50%  { transform: translate3d(11px, 13px, 0); }
      62%  { transform: translate3d(-7px, 17px, 0); }
      75%  { transform: translate3d(15px, -9px, 0); }
      87%  { transform: translate3d(-11px, -13px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    /* Уважение к prefers-reduced-motion — тоже без «кипения». */
    @media (prefers-reduced-motion: reduce) { #film-grain { animation: none; } }

    /* VHS-датакод в нижнем поле letterbox: ●REC + дата (вечный ноябрь) + часы суток. */
    #cine-osd {
      position: fixed;
      left: 3.2vw;
      bottom: 2.4vh;
      z-index: 5;
      pointer-events: none;
      font-family: var(--font-num);
      font-size: clamp(11px, 1.5vw, 16px);
      letter-spacing: 0.12em;
      color: #e8b96a;
      text-shadow: 0 0 6px rgba(232, 185, 106, 0.45);
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    body.cinema #cine-osd { opacity: 0.6; }
    .cine-rec {
      color: #d8553e;
      text-shadow: 0 0 7px rgba(216, 85, 62, 0.6);
    }
    /* Мигание ●REC — только в режиме любования (OSD скрыт вне него), иначе мигаем впустую. */
    body.cinema .cine-rec { animation: cine-blink 1.3s step-end infinite; }
    @keyframes cine-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.15; } }

    /* Тихая титульная строка на входе — fade-in → hold → fade-out (один прогон). */
    #cine-card {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
      max-width: 80vw;
      text-align: center;
      font-family: var(--font-paper);
      font-size: clamp(16px, 2.2vw, 24px);
      letter-spacing: 0.06em;
      line-height: 1.5;
      color: #f0e6d2;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
      opacity: 0;
    }
    #cine-card.show { animation: cine-card 5s ease forwards; }
    @keyframes cine-card {
      0%   { opacity: 0; }
      20%  { opacity: 1; }
      64%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* === Обучающие стрелки-указатели (см. ui.js showPointer) === */
    /* Амбер-стрелка + бумажная подпись наводят новичка на кнопку/панель в начале игры.
       Появляются на несколько секунд и плавно гаснут. z-index выше HUD (5-6), ниже
       модалок (z20). pointer-events:none — клики проходят сквозь них к игре. */
    .ui-pointer {
      position: fixed;
      z-index: 8;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .ui-pointer.show { opacity: 1; }
    /* транслейт зависит от стороны: для боковых — центрируем по высоте цели,
       для нижней — по горизонтали (стрелка под целью) */
    .ui-pointer.dir-right,
    .ui-pointer.dir-left { transform: translateY(-50%); }
    .ui-pointer.dir-below { flex-direction: column; transform: translateX(-50%); }
    /* below-right: стрелка ↑ под целью, подпись прижата к правому краю и растёт влево */
    .ui-pointer.dir-below-right { flex-direction: column; align-items: flex-end; }
    /* бумажная подпись — как у тоста-подсказки */
    .ui-pointer-label {
      padding: 9px 14px;
      background: linear-gradient(#f4edd9, #e7dabb);
      border: 1px solid var(--paper-edge);
      border-radius: 2px;
      box-shadow: 0 9px 20px rgba(0, 0, 0, 0.5);
      color: var(--ink);
      font-family: var(--font-paper);
      font-size: var(--fs-paper);
      line-height: 1.4;
      text-align: center;
      max-width: 230px;
    }
    /* сама стрелка — крупный амбер-глиф со свечением, «толкается» к цели */
    .ui-pointer-arrow {
      color: var(--amber);
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 0 12px var(--glow-amber);
    }
    .ui-pointer.dir-right .ui-pointer-arrow { animation: ptr-left 1.1s ease-in-out infinite; }
    .ui-pointer.dir-left .ui-pointer-arrow { animation: ptr-right 1.1s ease-in-out infinite; }
    .ui-pointer.dir-below .ui-pointer-arrow,
    .ui-pointer.dir-below-right .ui-pointer-arrow { animation: ptr-up 1.1s ease-in-out infinite; }
    @keyframes ptr-left { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-7px); } }
    @keyframes ptr-right { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(7px); } }
    @keyframes ptr-up { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    /* в режиме любования обучающие стрелки прячем (как и остальной HUD) */
    body.cinema .ui-pointer { opacity: 0; }

    /* Плашка ошибки — показывается, только если игра не запустилась */
    #error-overlay {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 24px;
      background: var(--panel-glass);
      color: var(--text-cream);
      font-family: var(--font-ui);
      border: 1px solid var(--panel-stroke);
      border-radius: var(--r-btn);
    }
  </style>

  <!-- importmap говорит браузеру, где брать Three.js (с CDN, версия зафиксирована) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="error-overlay"></div>
  <!-- Плёночное зерно: постоянный слой поверх всей игры (стиль и CSS — см. #film-grain выше) -->
  <div id="film-grain" aria-hidden="true"></div>
  <!-- ?v=N — версия для сброса кэша. При изменении кода бампать число (см. CLAUDE.md) -->
  <script type="module" src="src/game.js?v=84"></script>
</body>
</html>
